name: Build and release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0-unofficial.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$IN"
          OUT="DoNotTryAccessibility-Reborn-${TAG}.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" "$IN"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.tag }} — Unofficial build"
          body: |
            **Unofficial build** of DoNotTryAccessibility Reborn.

            This release is built from upstream source and is **not affiliated with or endorsed by** the upstream author.

            - Upstream source: https://github.com/zjz-Beiming/DoNotTryAccessibility-Reborn
            - Built from commit: `${{ github.sha }}`
            - License: GPL-3.0
            - Signing certificate SHA-256: `97:6B:80:67:DA:AC:2C:EE:A3:38:9C:40:90:22:64:89:C4:D5:10:24:67:28:88:B2:CF:5F:3E:FB:95:3B:13:E9`
            - Requires: Android 8.0+ (API 26), LSPosed 2.2.0+ / libxposed API 102 (or Vector 2.2+)
            - Scope: **System Framework** (Android System)

            ### Install
            1. Uninstall any previous build (different signing key).
            2. Install the APK below.
            3. Enable the module in LSPosed and keep scope **System Framework**.
            4. Reboot the device.
            5. Open the module app and select the apps to hide.

            Use at your own risk. See `SHA256SUMS.txt` for the APK checksum.
          files: |
            DoNotTryAccessibility-Reborn-*.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
